name: 15595 R5 gate refresh CLI and matched failure controls
on:
  push:
    branches:
      - ci/15595-verification
permissions:
  contents: read
concurrency:
  group: q15595-r5-gate-refresh-supplement-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  cli_complete:
    if: github.repository == 'LyleLiu666/qwen-code'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=6144
      QWEN_CODE_MODELS_DEV_REFRESH: off
      VITEST_MIN_FORKS: "1"
      VITEST_MAX_FORKS: "3"
      VITEST_MIN_THREADS: "1"
      VITEST_MAX_THREADS: "3"
      QWEN_CI_COVERAGE: ""
      LINT_BASE_SHA: ""
      OPENAI_API_KEY: ""
      DASHSCOPE_API_KEY: ""
      QWEN_API_KEY: ""
      GEMINI_API_KEY: ""
      CANDIDATE_SHA: f426a9a64bdb334c1caecc2337fe8f536567e3b5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.22.3
          package-manager-cache: false
      - name: Record exact revision
        env:
          EXPECTED_SHA: ${{ env.CANDIDATE_SHA }}
        run: |
          mkdir -p ci-evidence
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git show -s --format="%H %s" | tee ci-evidence/revision.txt
          node --version | tee ci-evidence/node-version.txt
          df -h | tee ci-evidence/disk-before.txt
          printf "%s\n" "$(nproc)" | tee ci-evidence/cpus.txt
          printf "%s\n" "$GITHUB_SHA" | tee ci-evidence/workflow-sha.txt
      - name: Install locked dependencies
        run: |
          set +e
          (
            set -e
            corepack pnpm install --frozen-lockfile
          ) 2>&1 | tee "ci-evidence/install-locked-dependencies.log"
          result=${PIPESTATUS[0]}
          echo "install-locked-dependencies=$result" >> ci-evidence/exits.txt
          exit "$result"
        id: install
        env:
          QWEN_SKIP_PREPARE: "1"
      - name: Build and bundle
        run: |
          set +e
          (
            set -e
            npm run build
            npm run bundle
          ) 2>&1 | tee "ci-evidence/build-and-bundle.log"
          result=${PIPESTATUS[0]}
          echo "build-and-bundle=$result" >> ci-evidence/exits.txt
          exit "$result"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        id: build
      - name: Install test and lint prerequisites
        run: |
          set +e
          (
            set -e
            sudo -n apt-get update -qq
            sudo -n apt-get install -y -qq tmux zip unzip python3-venv
            node --input-type=module -e '
            import {execSync} from "node:child_process";
            import {appendFileSync,mkdirSync,existsSync} from "node:fs";
            import {getLinters,getLinterTempDir} from "./scripts/lint.js";
            const dir=getLinterTempDir(); mkdirSync(dir,{recursive:true});
            for (const name of ["actionlint","shellcheck"]) {
             execSync(getLinters()[name].installer,{stdio:"inherit"});
             if(!existsSync(dir+"/"+name+"/"+name)) throw new Error(name+" missing");
             appendFileSync(process.env.GITHUB_PATH,dir+"/"+name+"\n");
            }'
            python3 -m venv "$RUNNER_TEMP/q15595-lint-python"
            "$RUNNER_TEMP/q15595-lint-python/bin/pip" install yamllint==1.35.1
            echo "$RUNNER_TEMP/q15595-lint-python/bin" >> "$GITHUB_PATH"
          ) 2>&1 | tee "ci-evidence/install-test-and-lint-prerequisites.log"
          result=${PIPESTATUS[0]}
          echo "install-test-and-lint-prerequisites=$result" >> ci-evidence/exits.txt
          exit "$result"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 10
      - name: Complete CLI scope without bail
        working-directory: packages/cli
        timeout-minutes: 150
        env:
          NODE_OPTIONS: --max-old-space-size=3072
        run: |
          set +e
          npx --no-install vitest run --bail=0 --retry=0 2>&1 | tee ../../ci-evidence/cli-complete.log
          result=${PIPESTATUS[0]}
          echo "cli-complete=$result" >> ../../ci-evidence/exits.txt
          exit "$result"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: q15595-r5-gate-refresh-cli-complete-${{ github.run_id }}
          path: ci-evidence
          retention-days: 14
    name: f426a9a64 complete CLI with bail disabled
  matched_failures:
    if: github.repository == 'LyleLiu666/qwen-code'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=6144
      QWEN_CODE_MODELS_DEV_REFRESH: off
      VITEST_MIN_FORKS: "1"
      VITEST_MAX_FORKS: "3"
      VITEST_MIN_THREADS: "1"
      VITEST_MAX_THREADS: "3"
      QWEN_CI_COVERAGE: ""
      LINT_BASE_SHA: ""
      OPENAI_API_KEY: ""
      DASHSCOPE_API_KEY: ""
      QWEN_API_KEY: ""
      GEMINI_API_KEY: ""
      BASELINE_SHA: 8660f754305b9f003064d58c96d1116b68073552
      CANDIDATE_SHA: f426a9a64bdb334c1caecc2337fe8f536567e3b5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.22.3
          package-manager-cache: false
      - name: Record exact revision
        env:
          EXPECTED_SHA: ${{ env.CANDIDATE_SHA }}
        run: |
          mkdir -p ci-evidence
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git show -s --format="%H %s" | tee ci-evidence/revision.txt
          node --version | tee ci-evidence/node-version.txt
          df -h | tee ci-evidence/disk-before.txt
          printf "%s\n" "$(nproc)" | tee ci-evidence/cpus.txt
          printf "%s\n" "$GITHUB_SHA" | tee ci-evidence/workflow-sha.txt
      - name: Install matched prerequisites
        run: |
          set +e
          (
            set -e
            sudo -n apt-get update -qq
            sudo -n apt-get install -y -qq tmux zip unzip python3-venv
            node --input-type=module -e '
            import {execSync} from "node:child_process";
            import {appendFileSync,mkdirSync,existsSync} from "node:fs";
            import {getLinters,getLinterTempDir} from "./scripts/lint.js";
            const dir=getLinterTempDir(); mkdirSync(dir,{recursive:true});
            for (const name of ["actionlint","shellcheck"]) {
             execSync(getLinters()[name].installer,{stdio:"inherit"});
             if(!existsSync(dir+"/"+name+"/"+name)) throw new Error(name+" missing");
             appendFileSync(process.env.GITHUB_PATH,dir+"/"+name+"\n");
            }'
            python3 -m venv "$RUNNER_TEMP/q15595-lint-python"
            "$RUNNER_TEMP/q15595-lint-python/bin/pip" install yamllint==1.35.1
            echo "$RUNNER_TEMP/q15595-lint-python/bin" >> "$GITHUB_PATH"
          ) 2>&1 | tee "ci-evidence/install-matched-prerequisites.log"
          result=${PIPESTATUS[0]}
          echo "install-matched-prerequisites=$result" >> ci-evidence/exits.txt
          exit "$result"
        timeout-minutes: 10
      - name: Two exact revisions and three complete failure files
        run: |
          set -euo pipefail
          root="$PWD"
          evidence="$root/ci-evidence"
          overall=0
          printf '%s\n' "${ImageOS:-}" "${ImageVersion:-}" > "$evidence/runner-image.txt"
          for entry in "baseline:$BASELINE_SHA" "candidate:$CANDIDATE_SHA"; do
            role="${entry%%:*}"
            sha="${entry#*:}"
            case_root="$RUNNER_TEMP/q15595-r5-gate-refresh-controls-$role"
            case_evidence="$evidence/$role"
            mkdir -p "$case_evidence"
            git cat-file -e "$sha^{commit}"
            git worktree add --detach "$case_root" "$sha"
            git -C "$case_root" rev-parse HEAD > "$case_evidence/revision.txt"
            node --version > "$case_evidence/node-version.txt"
            nproc > "$case_evidence/cpus.txt"
            df -h > "$case_evidence/disk-before.txt"
            set +e
            (cd "$case_root" && QWEN_SKIP_PREPARE=1 corepack pnpm install --frozen-lockfile && npm run build && npm run bundle) 2>&1 | tee "$case_evidence/install-build.log"
            build_result=${PIPESTATUS[0]}
            set -e
            echo "install-build=$build_result" >> "$case_evidence/exits.txt"
            if [ "$build_result" -eq 0 ]; then
              for item in 'worker:packages/cli:src/serve/managed-runtime-session-worker.test.ts' 'codemode:packages/core:src/code-mode/code-mode.test.ts' 'keyframes:packages/core:src/omni/policy/tools/extract-keyframes.test.ts'; do
                label="${item%%:*}"
                rest="${item#*:}"
                package="${rest%%:*}"
                file="${rest#*:}"
                test -f "$case_root/$package/$file"
                forks="$VITEST_MAX_FORKS"
                threads="$VITEST_MAX_THREADS"
                for attempt in 1 2 3; do
                  set +e
                  (cd "$case_root/$package" && NODE_OPTIONS=--max-old-space-size=3072 VITEST_MAX_FORKS="$forks" VITEST_MAX_THREADS="$threads" npx --no-install vitest run --retry=0 --bail=0 "$file" --reporter=default --reporter=json --outputFile="$case_evidence/$label-$attempt.json") 2>&1 | tee "$case_evidence/$label-$attempt.log"
                  result=${PIPESTATUS[0]}
                  set -e
                  echo "$label-$attempt=$result" >> "$case_evidence/exits.txt"
                  if [ "$result" -ne 0 ]; then overall=1; fi
                done
              done
            else
              overall=1
            fi
            git worktree remove --force "$case_root"
          done
          exit "$overall"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: q15595-r5-gate-refresh-same-runner-${{ github.run_id }}
          path: ci-evidence
          retention-days: 14
    name: 8660f75 and f426a9a64 same runner failure-file controls
