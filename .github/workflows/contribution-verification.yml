name: Contribution verification 15595
on:
  push:
    branches: [ci/15595-verification]
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'LyleLiu666/qwen-code'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        ref: [09283f386734047dc070e72d30a484b4df6df252, 60f5c1ed95d2803a4a898a1a56b9e980b4bc38e4]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
      QWEN_CODE_MODELS_DEV_REFRESH: 'off'
      VITEST_MIN_FORKS: '1'
      VITEST_MAX_FORKS: '3'
      VITEST_MIN_THREADS: '1'
      VITEST_MAX_THREADS: '3'
      QWEN_CI_COVERAGE: ''
    steps:
      - name: Configure Git line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.22.3'
          package-manager-cache: false
      - name: Check candidate and runtime
        run: |
          test "$(git rev-parse HEAD)" = "${{ matrix.ref }}"
          git show -s --format='%H %s'
          node --version
          corepack --version
      - id: install
        name: Install locked dependencies and build
        run: corepack pnpm install --frozen-lockfile
      - name: Compare full files for timing and notification order
        run: |
          set +e
          (cd packages/core && ../../node_modules/.bin/vitest run --maxWorkers=1 --retry=0 src/code-mode/code-mode.test.ts) > "$RUNNER_TEMP/core.log" 2>&1 &
          core=$!
          (cd packages/web-shell && ../../node_modules/.bin/vitest run --maxWorkers=1 --retry=0 client/browser-turn-notifications.test.tsx) > "$RUNNER_TEMP/web.log" 2>&1 &
          web=$!
          wait "$core"; cr=$?
          wait "$web"; wr=$?
          cat "$RUNNER_TEMP/core.log" "$RUNNER_TEMP/web.log"
          echo "Full-file results core=$cr web=$wr"
          exit $(( cr || wr ))
      - name: Three bounded samples of each originally failing assertion
        if: always() && steps.install.outcome == 'success'
        run: |
          set +e
          result=0
          for n in 1 2 3; do
            (cd packages/core && ../../node_modules/.bin/vitest run --maxWorkers=1 --retry=0 src/code-mode/code-mode.test.ts -t 'does not keep exec alive for an unawaited timer') > "$RUNNER_TEMP/sample-core" 2>&1 &
            core=$!
            (cd packages/web-shell && ../../node_modules/.bin/vitest run --maxWorkers=1 --retry=0 client/browser-turn-notifications.test.tsx -t 'localizes action reminders in Chinese') > "$RUNNER_TEMP/sample-web" 2>&1 &
            web=$!
            wait "$core"; cr=$?
            wait "$web"; wr=$?
            cat "$RUNNER_TEMP/sample-core" "$RUNNER_TEMP/sample-web"
            echo "Sample $n core=$cr web=$wr"
            if (( cr || wr )); then result=1; fi
          done
          exit "$result"
