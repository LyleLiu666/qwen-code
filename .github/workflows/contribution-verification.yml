name: Contribution verification 15595 Windows selector supplement
on:
  push:
    branches: [ci/15595-verification]
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'LyleLiu666/qwen-code'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
      QWEN_CODE_MODELS_DEV_REFRESH: 'off'
      VITEST_MIN_FORKS: '1'
      VITEST_MAX_FORKS: '3'
      VITEST_MIN_THREADS: '1'
      VITEST_MAX_THREADS: '3'
      QWEN_CI_COVERAGE: ''
    steps:
      - name: Configure Git line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 6a54c92293bba5a954fe4a667859622d89f82181
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.22.3'
          package-manager-cache: false
      - name: Record revision
        run: |
          mkdir -p ci-evidence
          test "$(git rev-parse HEAD)" = 6a54c92293bba5a954fe4a667859622d89f82181
          git show -s --format='%H %s' | tee ci-evidence/revision.txt
          node --version | tee ci-evidence/node-version.txt
          df -h | tee ci-evidence/disk-before.txt
      - id: install
        name: Install locked dependencies and build
        run: |
          set +e
          corepack pnpm install --frozen-lockfile 2>&1 | tee ci-evidence/install.log
          result=${PIPESTATUS[0]}
          echo "locked-install-and-build=$result" >> ci-evidence/exits.txt
          exit "$result"
      - name: Verify strict late repair controller cases
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/cli
        run: |
          set +e
          npx --no-install vitest run --maxWorkers=1 --minWorkers=1 --retry=0 src/ui/hooks/use-llm-stream.test.tsx -t 'settles a late repair result before replacing its placeholder' 2>&1 | tee ../../ci-evidence/late-repair-selector-supplement.log
          result=${PIPESTATUS[0]}
          echo "late-repair-selector-supplement=$result" >> ../../ci-evidence/exits.txt
          exit "$result"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cancellation-fix-late-repair-supplement-${{ matrix.os }}
          path: ci-evidence
          retention-days: 7
