name: Contribution verification 15595
on:
  push:
    branches: [ci/15595-verification]
permissions:
  contents: read
jobs:
  linux-followup:
    if: github.repository == 'LyleLiu666/qwen-code'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
      QWEN_CODE_MODELS_DEV_REFRESH: 'off'
      VITEST_MIN_FORKS: '1'
      VITEST_MAX_FORKS: '3'
      VITEST_MIN_THREADS: '1'
      VITEST_MAX_THREADS: '3'
      QWEN_CI_COVERAGE: ''
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: f1b3cc73c46a06fbd32bbac15ad90e77c4c99757
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.22.3'
          package-manager-cache: false
      - name: Record revision
        env:
          EXPECTED_SHA: f1b3cc73c46a06fbd32bbac15ad90e77c4c99757
        run: |
          mkdir -p ci-evidence
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git show -s --format='%H %s' | tee ci-evidence/revision.txt
          node --version
      - id: install
        name: Install identical locked dependencies and build
        run: corepack pnpm install --frozen-lockfile 2>&1 | tee ci-evidence/install.log
      - name: Diagnose uncompleted CLI files with bounded processes
        working-directory: packages/cli
        env:
          NODE_OPTIONS: --max-old-space-size=3072
        run: |
          cat > progress-reporter.mjs <<'JS'
          export default class {
            onTestModuleStart(m) { console.log('MODULE START', m.moduleId); }
            onTestModuleEnd(m) { console.log('MODULE END', m.moduleId); }
            onTestCaseReady(t) { console.log('CASE START', t.fullName); }
            onTestCaseResult(t) { console.log('CASE END', t.fullName, t.result().state); }
          }
          JS
          (while true; do date -u; ps -eo pid,ppid,pcpu,rss,stat,wchan:24,args --sort=-pcpu | head -25; sleep 30; done) > ../../ci-evidence/process-heartbeat.log 2>&1 &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          result=0
          for file in src/ui/hooks/use-llm-stream.test.tsx src/ui/AppContainer.test.tsx src/ui/components/InputPrompt.test.tsx; do
            set +e
            timeout --signal=TERM --kill-after=15s 8m npx --no-install vitest run "$file" --maxWorkers=1 --minWorkers=1 --retry=0 --reporter=default --reporter=./progress-reporter.mjs 2>&1 | tee "../../ci-evidence/$(basename "$file").log"
            rc=${PIPESTATUS[0]}
            set -e
            echo "$file exit $rc" | tee -a ../../ci-evidence/exits.txt
            if [ "$rc" -ne 0 ]; then result=$rc; fi
            if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then break; fi
          done
          exit "$result"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cli-stall-diagnostic
          path: ci-evidence
          retention-days: 7
