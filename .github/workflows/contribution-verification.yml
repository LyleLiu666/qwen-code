name: Qwen Code 15595 isolated local inference
on:
  push:
    branches: [ci/15595-verification]
permissions:
  contents: read
jobs:
  live:
    if: github.repository == 'LyleLiu666/qwen-code'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: harness
          persist-credentials: false
          sparse-checkout: ci-harness
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: candidate
          ref: 09283f386734047dc070e72d30a484b4df6df252
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.22.3'
          package-manager-cache: false
      - name: Prepare runner disk and loopback namespace
        run: |
          test "$(git -C candidate rev-parse HEAD)" = 09283f386734047dc070e72d30a484b4df6df252
          if [ "$(df --output=avail -B1 . | tail -1)" -lt 34359738368 ]; then
            sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          fi
          mkdir -p "$RUNNER_TEMP/live-home" "$RUNNER_TEMP/live-evidence"
          sudo ip netns add qwen-live
          sudo ip -n qwen-live link set lo up
          sudo ip -n qwen-live address show
          df -h .; free -h; nproc
      - name: Install verified CPU inference runtime and model
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 2 https://github.com/ollama/ollama/releases/download/v0.40.14/ollama-linux-amd64.tar.zst -o ollama.tar.zst
          echo '993e83d08c3d13d17c55009a3e2664c8a25445e644aec3a68bef5abb6abce67d  ollama.tar.zst' | sha256sum --check
          mkdir ollama && tar -xf ollama.tar.zst -C ollama --exclude='*cuda*' --exclude='*rocm*'
          rm ollama.tar.zst
          python3 "$GITHUB_WORKSPACE/harness/ci-harness/prepare-model.py"
          df -h .
      - name: Build exact candidate with locked dependencies
        working-directory: candidate
        run: corepack pnpm install --frozen-lockfile
      - name: Start local Qwen model service
        run: |
          h=harness/ci-harness
          bash "$h/run-local.sh" sh -c 'nohup "$RUNNER_TEMP/ollama/bin/ollama" serve > "$RUNNER_TEMP/live-evidence/ollama.log" 2>&1 < /dev/null &'
          bash "$h/run-local.sh" bash -c 'for n in {1..30}; do curl -fsS http://127.0.0.1:11434/api/tags && exit 0; sleep 1; done; exit 1'
      - name: Run original cases (pilot)
        id: group_pilot
        working-directory: candidate
        continue-on-error: true
        run: bash ../harness/ci-harness/run-group.sh pilot 11,36 headless
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: "!cancelled() && hashFiles('harness/ci-harness/run-group.sh') != ''"
        with:
          name: results-pilot
          path: ${{ runner.temp }}/live-evidence/checkpoint-pilot.json
          if-no-files-found: warn
          retention-days: 7
      - name: Run original cases (files)
        id: group_files
        working-directory: candidate
        continue-on-error: true
        run: bash ../harness/ci-harness/run-group.sh files 12,13,14,16,17,18,41,42,43 -
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: "!cancelled() && hashFiles('harness/ci-harness/run-group.sh') != ''"
        with:
          name: results-files
          path: ${{ runner.temp }}/live-evidence/checkpoint-files.json
          if-no-files-found: warn
          retention-days: 7
      - name: Run original cases (cron)
        id: group_cron
        working-directory: candidate
        continue-on-error: true
        run: bash ../harness/ci-harness/run-group.sh cron 5,6,7,8,9,10 -
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: "!cancelled() && hashFiles('harness/ci-harness/run-group.sh') != ''"
        with:
          name: results-cron
          path: ${{ runner.temp }}/live-evidence/checkpoint-cron.json
          if-no-files-found: warn
          retention-days: 7
      - name: Run original cases (shell)
        id: group_shell
        working-directory: candidate
        continue-on-error: true
        run: bash ../harness/ci-harness/run-group.sh shell 27,28,29,30,32,33,34,35 -
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: "!cancelled() && hashFiles('harness/ci-harness/run-group.sh') != ''"
        with:
          name: results-shell
          path: ${{ runner.temp }}/live-evidence/checkpoint-shell.json
          if-no-files-found: warn
          retention-days: 7
      - name: Run original cases (discovery)
        id: group_discovery
        working-directory: candidate
        continue-on-error: true
        run: bash ../harness/ci-harness/run-group.sh discovery 20,22,24,25,26,31,38,39,40 -
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: "!cancelled() && hashFiles('harness/ci-harness/run-group.sh') != ''"
        with:
          name: results-discovery
          path: ${{ runner.temp }}/live-evidence/checkpoint-discovery.json
          if-no-files-found: warn
          retention-days: 7
      - name: Run original cases (schema-inline)
        id: group_schema_inline
        working-directory: candidate
        continue-on-error: true
        run: bash ../harness/ci-harness/run-group.sh schema-inline 19 schema1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: "!cancelled() && hashFiles('harness/ci-harness/run-group.sh') != ''"
        with:
          name: results-schema-inline
          path: ${{ runner.temp }}/live-evidence/checkpoint-schema-inline.json
          if-no-files-found: warn
          retention-days: 7
      - name: Run original cases (schema-file)
        id: group_schema_file
        working-directory: candidate
        continue-on-error: true
        run: bash ../harness/ci-harness/run-group.sh schema-file 21 schema2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: "!cancelled() && hashFiles('harness/ci-harness/run-group.sh') != ''"
        with:
          name: results-schema-file
          path: ${{ runner.temp }}/live-evidence/checkpoint-schema-file.json
          if-no-files-found: warn
          retention-days: 7
      - name: Run original cases (monitor)
        id: group_monitor
        working-directory: candidate
        continue-on-error: true
        run: bash ../harness/ci-harness/run-group.sh monitor 23 monitor
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: "!cancelled() && hashFiles('harness/ci-harness/run-group.sh') != ''"
        with:
          name: results-monitor
          path: ${{ runner.temp }}/live-evidence/checkpoint-monitor.json
          if-no-files-found: warn
          retention-days: 7
      - name: Run original cases (todo)
        id: group_todo
        working-directory: candidate
        continue-on-error: true
        run: bash ../harness/ci-harness/run-group.sh todo 37 todo
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: "!cancelled() && hashFiles('harness/ci-harness/run-group.sh') != ''"
        with:
          name: results-todo
          path: ${{ runner.temp }}/live-evidence/checkpoint-todo.json
          if-no-files-found: warn
          retention-days: 7
      - name: Run original cases (acp)
        id: group_acp
        working-directory: candidate
        continue-on-error: true
        run: bash ../harness/ci-harness/run-group.sh acp 1,2,3,4 acp
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: "!cancelled() && hashFiles('harness/ci-harness/run-group.sh') != ''"
        with:
          name: results-acp
          path: ${{ runner.temp }}/live-evidence/checkpoint-acp.json
          if-no-files-found: warn
          retention-days: 7
      - name: Stop local service
        if: always()
        run: |
          tail -20 "$RUNNER_TEMP/live-evidence/ollama.log" || true
          sudo ip netns pids qwen-live | xargs -r sudo kill || true
          sudo ip netns del qwen-live || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: isolated-real-qwen
          path: ${{ runner.temp }}/live-evidence
          retention-days: 7
      - name: Verify exact original results
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']) / 'live-evidence'
          rows=[json.loads(p.read_text()) for p in root.glob('target-*/**/result.json')]
          passed=sum(r['status']=='PASS' for r in rows)
          print('Isolated results:', len(rows), 'targeted,', passed, 'passed')
          assert len({r['case'] for r in rows})==42 and passed==42
          PY
