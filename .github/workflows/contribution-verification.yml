name: Contribution verification 15595
on:
  push:
    branches: [ci/15595-verification]
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'LyleLiu666/qwen-code'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
        ref: [09283f386734047dc070e72d30a484b4df6df252, 60f5c1ed95d2803a4a898a1a56b9e980b4bc38e4]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
      QWEN_CODE_MODELS_DEV_REFRESH: 'off'
      VITEST_MIN_FORKS: '1'
      VITEST_MAX_FORKS: '3'
      VITEST_MIN_THREADS: '1'
      VITEST_MAX_THREADS: '3'
      QWEN_CI_COVERAGE: ''
    steps:
      - name: Configure Git line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.22.3'
          package-manager-cache: false
      - name: Check candidate and runtime
        run: |
          test "$(git rev-parse HEAD)" = "${{ matrix.ref }}"
          git show -s --format='%H %s'
          node --version
          corepack --version
      - id: install
        name: Install locked dependencies and build
        run: corepack pnpm install --frozen-lockfile
      - name: Check original fixture in default temp directory
        continue-on-error: true
        working-directory: packages/core
        run: |
          npx --no-install vitest run --maxWorkers=1 --minWorkers=1 --retry=0 src/code-mode/goal-evidence.test.ts
      - name: Check fixture in runner temp directory
        working-directory: packages/core
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: |
          npx --no-install vitest run --maxWorkers=1 --minWorkers=1 --retry=0 src/code-mode/goal-evidence.test.ts
      - name: Verify final admission and cancellation
        if: always() && matrix.ref == '09283f386734047dc070e72d30a484b4df6df252' && steps.install.outcome == 'success'
        working-directory: packages/core
        run: |
          npx --no-install vitest run --maxWorkers=2 --minWorkers=1 src/services/session-api-history.test.ts src/services/session-transcript-reader.test.ts src/services/chatRecordingService.test.ts src/core/llm-chat.test.ts -t 'model history of completed tools|complete result of the current round|round-trips a recorded Goal|rejects a cancelled tool result|does not count a request cancelled'
