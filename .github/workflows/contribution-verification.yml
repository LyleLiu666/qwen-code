name: 15595 Nov5 complete CLI and worker comparison
'on':
  push:
    branches:
    - ci/15595-verification
permissions:
  contents: read
concurrency:
  group: q15595-nov5-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  compare:
    if: github.repository == 'LyleLiu666/qwen-code'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
      QWEN_CODE_MODELS_DEV_REFRESH: 'off'
      VITEST_MIN_FORKS: '1'
      VITEST_MAX_FORKS: '3'
      VITEST_MIN_THREADS: '1'
      VITEST_MAX_THREADS: '3'
      QWEN_CI_COVERAGE: ''
      LINT_BASE_SHA: ''
      OPENAI_API_KEY: ''
      DASHSCOPE_API_KEY: ''
      QWEN_API_KEY: ''
      GEMINI_API_KEY: ''
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        ref: ${{ matrix.sha }}
        persist-credentials: false
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version: 22.22.3
        package-manager-cache: false
    - name: Record exact revision
      env:
        EXPECTED_SHA: ${{ matrix.sha }}
      run: 'mkdir -p ci-evidence

        [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]

        test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

        git show -s --format="%H %s" | tee ci-evidence/revision.txt

        node --version | tee ci-evidence/node-version.txt

        df -h | tee ci-evidence/disk-before.txt

        printf "%s\n" "$(nproc)" | tee ci-evidence/cpus.txt

        printf "%s\n" "$GITHUB_SHA" | tee ci-evidence/workflow-sha.txt

        '
    - name: Install locked dependencies
      run: "set +e\n(\n  set -e\n  corepack pnpm install --frozen-lockfile\n) 2>&1 | tee \"ci-evidence/install-locked-dependencies.log\"\nresult=${PIPESTATUS[0]}\necho \"install-locked-dependencies=$result\" >> ci-evidence/exits.txt\nexit \"$result\"\n"
      id: install
      env:
        QWEN_SKIP_PREPARE: '1'
    - name: Build and bundle
      run: "set +e\n(\n  set -e\n  npm run build\n  npm run bundle\n) 2>&1 | tee \"ci-evidence/build-and-bundle.log\"\nresult=${PIPESTATUS[0]}\necho \"build-and-bundle=$result\" >> ci-evidence/exits.txt\nexit \"$result\"\n"
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      id: build
    - name: Install matched prerequisites
      run: "set +e\n(\n  set -e\n  sudo -n apt-get update -qq\n  sudo -n apt-get install -y -qq tmux zip unzip python3-venv\n  node --input-type=module -e '\n  import {execSync} from \"node:child_process\";\n  import {appendFileSync,mkdirSync,existsSync} from \"node:fs\";\n  import {getLinters,getLinterTempDir} from \"./scripts/lint.js\";\n  const dir=getLinterTempDir(); mkdirSync(dir,{recursive:true});\n  for (const name of [\"actionlint\",\"shellcheck\"]) {\n   execSync(getLinters()[name].installer,{stdio:\"inherit\"});\n   if(!existsSync(dir+\"/\"+name+\"/\"+name)) throw new Error(name+\" missing\");\n   appendFileSync(process.env.GITHUB_PATH,dir+\"/\"+name+\"\\n\");\n  }'\n  python3 -m venv \"$RUNNER_TEMP/q15595-lint-python\"\n  \"$RUNNER_TEMP/q15595-lint-python/bin/pip\" install yamllint==1.35.1\n  echo \"$RUNNER_TEMP/q15595-lint-python/bin\" >> \"$GITHUB_PATH\"\n) 2>&1 | tee \"ci-evidence/install-matched-prerequisites.log\"\nresult=${PIPESTATUS[0]}\necho \"install-matched-prerequisites=$result\" >> ci-evidence/exits.txt\nexit \"$result\"\n"
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      timeout-minutes: 10
    - name: Matched whole-file attempts
      run: "set +e\n(\n  set -e\n  overall=0\n  [[ \"$PACKAGE_DIR\" != /* && \"$TEST_FILE\" != /* ]]\n  [[ \"$PACKAGE_DIR\" != *..* && \"$TEST_FILE\" != *..* ]]\n  test -f \"$PACKAGE_DIR/$TEST_FILE\"\n  for attempt in 1 2 3; do\n    set +e\n    (cd \"$PACKAGE_DIR\" && NODE_OPTIONS=--max-old-space-size=3072 npx --no-install vitest run --retry=0 \"$TEST_FILE\") 2>&1 | tee \"ci-evidence/attempt-$attempt.log\"\n    result=${PIPESTATUS[0]}\n    echo \"attempt-$attempt=$result\" >> ci-evidence/exits.txt\n    if [ \"$result\" -ne 0 ]; then overall=1; fi\n    set -e\n  done\n  exit \"$overall\"\n) 2>&1 | tee \"ci-evidence/matched-whole-file-attempts.log\"\nresult=${PIPESTATUS[0]}\necho \"matched-whole-file-attempts=$result\" >> ci-evidence/exits.txt\nexit \"$result\"\n"
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      env:
        PACKAGE_DIR: packages/cli
        TEST_FILE: src/serve/managed-runtime-session-worker.test.ts
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: ${{ always() }}
      with:
        name: q15595-nov5-compare-${{ matrix.role }}-${{ github.run_id }}
        path: ci-evidence
        retention-days: 14
    strategy:
      fail-fast: false
      matrix:
        include:
        - role: candidate
          sha: d5bda64e2efef0ead9aa8616ecd0ca81490ea088
        - role: baseline
          sha: 07a4fda66622fc5337f4182d956736af146dad87
    name: ${{ matrix.role }} matched file
  cli_complete:
    if: github.repository == 'LyleLiu666/qwen-code'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
      QWEN_CODE_MODELS_DEV_REFRESH: 'off'
      VITEST_MIN_FORKS: '1'
      VITEST_MAX_FORKS: '3'
      VITEST_MIN_THREADS: '1'
      VITEST_MAX_THREADS: '3'
      QWEN_CI_COVERAGE: ''
      LINT_BASE_SHA: ''
      OPENAI_API_KEY: ''
      DASHSCOPE_API_KEY: ''
      QWEN_API_KEY: ''
      GEMINI_API_KEY: ''
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        ref: d5bda64e2efef0ead9aa8616ecd0ca81490ea088
        persist-credentials: false
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version: 22.22.3
        package-manager-cache: false
    - name: Record exact revision
      env:
        EXPECTED_SHA: d5bda64e2efef0ead9aa8616ecd0ca81490ea088
      run: 'mkdir -p ci-evidence

        [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]

        test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

        git show -s --format="%H %s" | tee ci-evidence/revision.txt

        node --version | tee ci-evidence/node-version.txt

        df -h | tee ci-evidence/disk-before.txt

        printf "%s\n" "$(nproc)" | tee ci-evidence/cpus.txt

        printf "%s\n" "$GITHUB_SHA" | tee ci-evidence/workflow-sha.txt

        '
    - name: Install locked dependencies
      run: "set +e\n(\n  set -e\n  corepack pnpm install --frozen-lockfile\n) 2>&1 | tee \"ci-evidence/install-locked-dependencies.log\"\nresult=${PIPESTATUS[0]}\necho \"install-locked-dependencies=$result\" >> ci-evidence/exits.txt\nexit \"$result\"\n"
      id: install
      env:
        QWEN_SKIP_PREPARE: '1'
    - name: Build and bundle
      run: "set +e\n(\n  set -e\n  npm run build\n  npm run bundle\n) 2>&1 | tee \"ci-evidence/build-and-bundle.log\"\nresult=${PIPESTATUS[0]}\necho \"build-and-bundle=$result\" >> ci-evidence/exits.txt\nexit \"$result\"\n"
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      id: build
    - name: Install matched prerequisites
      run: "set +e\n(\n  set -e\n  sudo -n apt-get update -qq\n  sudo -n apt-get install -y -qq tmux zip unzip python3-venv\n  node --input-type=module -e '\n  import {execSync} from \"node:child_process\";\n  import {appendFileSync,mkdirSync,existsSync} from \"node:fs\";\n  import {getLinters,getLinterTempDir} from \"./scripts/lint.js\";\n  const dir=getLinterTempDir(); mkdirSync(dir,{recursive:true});\n  for (const name of [\"actionlint\",\"shellcheck\"]) {\n   execSync(getLinters()[name].installer,{stdio:\"inherit\"});\n   if(!existsSync(dir+\"/\"+name+\"/\"+name)) throw new Error(name+\" missing\");\n   appendFileSync(process.env.GITHUB_PATH,dir+\"/\"+name+\"\\n\");\n  }'\n  python3 -m venv \"$RUNNER_TEMP/q15595-lint-python\"\n  \"$RUNNER_TEMP/q15595-lint-python/bin/pip\" install yamllint==1.35.1\n  echo \"$RUNNER_TEMP/q15595-lint-python/bin\" >> \"$GITHUB_PATH\"\n) 2>&1 | tee \"ci-evidence/install-matched-prerequisites.log\"\nresult=${PIPESTATUS[0]}\necho \"install-matched-prerequisites=$result\" >> ci-evidence/exits.txt\nexit \"$result\"\n"
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      timeout-minutes: 10
    - name: Complete all CLI files without bail
      run: 'set +e

        npx --no-install vitest run --retry=0 2>&1 | tee ../../ci-evidence/cli-complete.log

        result=${PIPESTATUS[0]}

        echo "cli-complete=$result" >> ../../ci-evidence/exits.txt

        exit "$result"

        '
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      working-directory: packages/cli
      timeout-minutes: 150
      env:
        NODE_OPTIONS: --max-old-space-size=3072
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: ${{ always() }}
      with:
        name: q15595-nov5-cli-complete-${{ github.run_id }}
        path: ci-evidence
        retention-days: 14
    name: candidate complete CLI without bail
