name: Contribution verification 15595
on:
  push:
    branches: [ci/15595-verification]
permissions:
  contents: read
jobs:
  baseline-windows:
    if: github.repository == 'LyleLiu666/qwen-code'
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
      QWEN_CODE_MODELS_DEV_REFRESH: 'off'
      VITEST_MIN_FORKS: '1'
      VITEST_MAX_FORKS: '3'
      VITEST_MIN_THREADS: '1'
      VITEST_MAX_THREADS: '3'
      QWEN_CI_COVERAGE: ''
    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 9b1fcb8756a6bd2b7085c56963f60f5322d1ea3f
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.22.3'
          package-manager-cache: false
      - name: Record revision
        run: |
          mkdir -p ci-evidence
          test "$(git rev-parse HEAD)" = 9b1fcb8756a6bd2b7085c56963f60f5322d1ea3f
          git show -s --format='%H %s' | tee ci-evidence/revision.txt
          node --version
      - id: install
        name: Install identical locked dependencies and build
        run: corepack pnpm install --frozen-lockfile 2>&1 | tee ci-evidence/install.log
      - name: Compare the two original interactive failures on unchanged main
        working-directory: integration-tests
        run: |
          ../node_modules/.bin/vitest run --config ./vitest.config.ts --maxWorkers=1 --minWorkers=1 --retry=0 cli/tool-hook-context.test.ts -t 'interactive:' 2>&1 | tee ../ci-evidence/interactive-baseline.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: main-baseline-windows-interactive
          path: ci-evidence
          retention-days: 7
