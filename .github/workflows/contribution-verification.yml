name: Contribution verification 15595 Git history transport
on:
  push:
    branches: [ci/15595-verification]
permissions:
  contents: read
jobs:
  bundle:
    if: github.repository == 'LyleLiu666/qwen-code'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: QwenLM/qwen-code
          ref: 07a4fda66622fc5337f4182d956736af146dad87
          fetch-depth: 0
          persist-credentials: false
      - name: Export verified upstream history
        run: |
          set -euo pipefail
          target=07a4fda66622fc5337f4182d956736af146dad87
          base=9b1fcb8756a6bd2b7085c56963f60f5322d1ea3f
          test "$(git rev-parse HEAD)" = "$target"
          git merge-base --is-ancestor "$base" "$target"
          git update-ref refs/heads/export-main "$target"
          mkdir evidence
          git bundle create evidence/main-07a4fda.bundle refs/heads/export-main "^$base"
          git bundle verify evidence/main-07a4fda.bundle 2>&1 | tee evidence/verify.txt
          git log --format='%H %P %s' "$base..$target" > evidence/commits.txt
          sha256sum evidence/main-07a4fda.bundle > evidence/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: upstream-main-07a4fda-git-bundle
          path: evidence
          retention-days: 7
