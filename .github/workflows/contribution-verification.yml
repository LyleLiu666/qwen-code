name: Qwen Code 15595 real local inference
on:
  push:
    branches: [ci/15595-verification]
permissions:
  contents: read
jobs:
  live:
    if: github.repository == 'LyleLiu666/qwen-code'
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: harness
          persist-credentials: false
          sparse-checkout: ci-harness
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: candidate
          ref: 09283f386734047dc070e72d30a484b4df6df252
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.22.3'
          package-manager-cache: false
      - name: Prepare runner disk and loopback namespace
        run: |
          test "$(git -C candidate rev-parse HEAD)" = 09283f386734047dc070e72d30a484b4df6df252
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          mkdir -p "$RUNNER_TEMP/live-home" "$RUNNER_TEMP/live-evidence"
          sudo ip netns add qwen-live
          sudo ip -n qwen-live link set lo up
          sudo ip -n qwen-live address show
          df -h .; free -h; nproc
      - name: Install verified CPU inference runtime and model
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 2 https://github.com/ollama/ollama/releases/download/v0.40.14/ollama-linux-amd64.tar.zst -o ollama.tar.zst
          echo '993e83d08c3d13d17c55009a3e2664c8a25445e644aec3a68bef5abb6abce67d  ollama.tar.zst' | sha256sum --check
          mkdir ollama && tar -xf ollama.tar.zst -C ollama --exclude='*cuda*' --exclude='*rocm*'
          rm ollama.tar.zst
          python3 "$GITHUB_WORKSPACE/harness/ci-harness/prepare-model.py"
          df -h .
      - name: Build exact candidate with locked dependencies
        working-directory: candidate
        run: corepack pnpm install --frozen-lockfile
      - name: Start local Qwen model service
        run: |
          h=harness/ci-harness
          bash "$h/run-local.sh" sh -c 'nohup "$RUNNER_TEMP/ollama/bin/ollama" serve > "$RUNNER_TEMP/live-evidence/ollama.log" 2>&1 < /dev/null &'
          bash "$h/run-local.sh" bash -c 'for n in {1..30}; do curl -fsS http://127.0.0.1:11434/api/tags && exit 0; sleep 1; done; exit 1'
      - name: Warm the model with neutral public system and tool descriptions
        working-directory: candidate
        run: |
          bash ../harness/ci-harness/run-local.sh curl -fsS --max-time 1100 -H 'Content-Type: application/json' --data-binary @../harness/ci-harness/neutral-warmup.json http://127.0.0.1:11434/v1/chat/completions > "$RUNNER_TEMP/live-evidence/neutral-warmup-response.json"
          test -s "$RUNNER_TEMP/live-evidence/neutral-warmup-response.json"
      - id: representative
        name: Original read_file with Qwen tool request and reply
        working-directory: candidate
        run: bash ../harness/ci-harness/run-local.sh python3 -u ../harness/ci-harness/run-live.py rep
      - id: diagnostic
        if: "!cancelled() && steps.representative.outcome == 'failure'"
        name: Bounded read_file latency diagnostic with original assertions
        working-directory: candidate
        run: |
          e="$RUNNER_TEMP/live-evidence"
          python3 - "$e/rep" <<'PYTIME'
          import sys
          from pathlib import Path
          text = next(Path(sys.argv[1]).glob('*/vitest.log')).read_text()
          if 'timed out in 300000ms' not in text:
              raise SystemExit('Original failure was not the outer test timeout. Retain it for diagnosis.')
          PYTIME
          mv "$e/rep" "$e/rep-original-warm"
          cp "$e/coverage.json" "$e/coverage-original-warm.json"
          bash ../harness/ci-harness/run-local.sh env TB_TIMEOUT_MINUTES=15 python3 -u ../harness/ci-harness/run-live.py rep
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: "!cancelled() && (steps.representative.outcome == 'success' || steps.diagnostic.outcome == 'success')"
        with:
          name: representative-read-file
          path: ${{ runner.temp }}/live-evidence
          retention-days: 7
      - name: Remaining original cases, one at a time
        if: "!cancelled() && (steps.representative.outcome == 'success' || steps.diagnostic.outcome == 'success')"
        working-directory: candidate
        run: bash ../harness/ci-harness/run-local.sh python3 -u ../harness/ci-harness/run-live.py rest
      - name: Show evidence summary and stop local service
        if: always()
        run: |
          ls -la "$RUNNER_TEMP/live-evidence"
          tail -20 "$RUNNER_TEMP/live-evidence/ollama.log" || true
          sudo ip netns pids qwen-live | xargs -r sudo kill || true
          sudo ip netns del qwen-live || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: real-qwen-43
          path: ${{ runner.temp }}/live-evidence
          retention-days: 7
