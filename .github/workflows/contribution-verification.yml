name: Contribution verification 15595
on:
  push:
    branches: [ci/15595-verification]
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'LyleLiu666/qwen-code'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
      QWEN_CODE_MODELS_DEV_REFRESH: 'off'
      VITEST_MIN_FORKS: '1'
      VITEST_MAX_FORKS: '3'
      VITEST_MIN_THREADS: '1'
      VITEST_MAX_THREADS: '3'
      QWEN_CI_COVERAGE: ''
    steps:
      - name: Configure Git line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fe78fd54eb8d84001ed45ddab2836cf5fd8f5e46
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.22.3'
          package-manager-cache: false
      - name: Record revision
        run: |
          mkdir -p ci-evidence
          test "$(git rev-parse HEAD)" = fe78fd54eb8d84001ed45ddab2836cf5fd8f5e46
          git show -s --format='%H %s' | tee ci-evidence/revision.txt
          node --version | tee ci-evidence/node-version.txt
          df -h | tee ci-evidence/disk-before.txt
      - id: install
        name: Install locked dependencies and build
        run: |
          set +e
          corepack pnpm install --frozen-lockfile 2>&1 | tee ci-evidence/install.log
          result=${PIPESTATUS[0]}
          echo "locked-install-and-build=$result" >> ci-evidence/exits.txt
          exit "$result"
      - name: Typecheck
        if: steps.install.outcome == 'success' && runner.os == 'Linux'
        run: |
          set +e
          npm run typecheck 2>&1 | tee ci-evidence/typecheck.log
          result=${PIPESTATUS[0]}
          echo "typecheck=$result" >> ci-evidence/exits.txt
          exit "$result"
      - name: Verify cancellation and recovery components
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.install.outcome == 'success' }}
        working-directory: packages/core
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          npx --no-install vitest run --maxWorkers=1 --minWorkers=1 --retry=0 src/services/session-api-history.test.ts src/services/session-transcript-reader.test.ts src/services/chatRecordingService.test.ts src/core/llm-chat.test.ts src/code-mode/goal-evidence.test.ts -t 'model history of completed tools|complete result of the current round|round-trips a recorded Goal|preserves an ordinary prompt cancelled|withholds cancelled tool-owned|checks tool cancellation|restores prepared history when cancellation|does not count a request cancelled|Goal evidence' 2>&1 | tee ../../ci-evidence/core-focused.log
      - name: Verify ACP shared prompt and automatic rounds
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.install.outcome == 'success' }}
        working-directory: packages/cli
        run: |
          npx --no-install vitest run --maxWorkers=1 --minWorkers=1 --retry=0 src/acp-integration/session/Session.test.ts -t 'shared agent loop round|delivers refined recall after tool responses|injects drained mid-turn user messages' 2>&1 | tee ../../ci-evidence/acp-focused.log
      - name: Verify real ACP and headless with loopback model
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: integration-tests
        run: |
          ../node_modules/.bin/vitest run --config ./vitest.config.ts --maxWorkers=1 --minWorkers=1 --retry=0 cli/tool-hook-context.test.ts cli/acp-agent-loop-parity.test.ts 2>&1 | tee ../ci-evidence/integration.log
      - name: Provision pinned linters
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.install.outcome == 'success' }}
        run: |
          node --input-type=module -e '
            import { execSync } from "node:child_process";
            import { appendFileSync, existsSync, mkdirSync } from "node:fs";
            import { getLinters, getLinterTempDir } from "./scripts/lint.js";
            const tempDir = getLinterTempDir();
            mkdirSync(tempDir, { recursive: true });
            const linters = getLinters();
            for (const name of ["actionlint", "shellcheck"]) {
              execSync(linters[name].installer, { stdio: "inherit" });
              if (!existsSync(tempDir + "/" + name + "/" + name)) throw new Error(name + " missing");
              appendFileSync(process.env.GITHUB_PATH, tempDir + "/" + name + "\n");
            }
          '
      - name: Run official repository unit lanes
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.install.outcome == 'success' }}
        timeout-minutes: 150
        env:
          SIDE_LANE_LOG: ${{ github.workspace }}/ci-evidence/side-lane.log
        run: |
          set +e
          bash .github/scripts/ci/run-unit-test-lanes.sh --retry=0 2>&1 | tee ci-evidence/full-suite.log
          result=${PIPESTATUS[0]}
          echo "official-unit-lanes=$result" >> ci-evidence/exits.txt
          exit "$result"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cancellation-fix-${{ matrix.os }}
          path: ci-evidence
          retention-days: 7
