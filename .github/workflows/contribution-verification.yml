name: Current main compatibility 15595
on:
  push:
    branches: [ci/15595-verification]
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'LyleLiu666/qwen-code'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
      QWEN_CODE_MODELS_DEV_REFRESH: 'off'
      VITEST_MIN_FORKS: '1'
      VITEST_MAX_FORKS: '3'
      VITEST_MIN_THREADS: '1'
      VITEST_MAX_THREADS: '3'
      QWEN_CI_COVERAGE: ''
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 659331efd21756104aa3053b5fe40c7b4b8f8139
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.22.3'
          package-manager-cache: false
      - name: Check candidate and runtime
        run: |
          test "$(git rev-parse HEAD)" = 659331efd21756104aa3053b5fe40c7b4b8f8139
          git show -s --format='%H %s'
          node --version
          corepack --version
      - name: Apply candidate to verified upstream snapshot
        run: |
          git fetch --no-tags https://github.com/QwenLM/qwen-code.git 71119c6fa061b5ef147057679343fc5f989497df
          git -c user.name=ci -c user.email=ci@localhost merge --no-ff --no-commit 71119c6fa061b5ef147057679343fc5f989497df
          test "$(git write-tree)" = 68963d2f50e141b8978bbae3986f98bc1da94661
      - id: install
        name: Install locked dependencies and build
        run: corepack pnpm install --frozen-lockfile
      - name: Verify admission, recovery, forks and cancellation
        working-directory: packages/core
        run: |
          npx --no-install vitest run --maxWorkers=2 --minWorkers=1 src/services/session-api-history.test.ts src/services/session-transcript-reader.test.ts src/services/chatRecordingService.test.ts src/core/llm-chat.test.ts -t 'model history of completed tools|complete result of the current round|round-trips a recorded Goal|rejects a cancelled tool result|does not count a request cancelled'
      - name: Check model requests with a loopback provider
        if: always() && steps.install.outcome == 'success'
        working-directory: integration-tests
        run: |
          ../node_modules/.bin/vitest run --config ./vitest.config.ts --maxWorkers=1 --minWorkers=1 --retry=0 cli/tool-hook-context.test.ts cli/acp-agent-loop-parity.test.ts -t 'resumes only tool output admitted|cancels a tool-result request whose|a Goal its second continuation completes'
