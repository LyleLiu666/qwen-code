name: 15595 R3 CLI coverage and matched failure controls
'on':
  push:
    branches:
    - ci/15595-verification
permissions:
  contents: read
concurrency:
  group: q15595-review3-supplement-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  cli_complete:
    if: github.repository == 'LyleLiu666/qwen-code'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
      QWEN_CODE_MODELS_DEV_REFRESH: 'off'
      VITEST_MIN_FORKS: '1'
      VITEST_MAX_FORKS: '3'
      VITEST_MIN_THREADS: '1'
      VITEST_MAX_THREADS: '3'
      QWEN_CI_COVERAGE: ''
      LINT_BASE_SHA: ''
      OPENAI_API_KEY: ''
      DASHSCOPE_API_KEY: ''
      QWEN_API_KEY: ''
      GEMINI_API_KEY: ''
      CANDIDATE_SHA: 608c03b0858ca0d9235805fa0d60d32eea32cead
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        ref: ${{ env.CANDIDATE_SHA }}
        persist-credentials: false
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version: 22.22.3
        package-manager-cache: false
    - name: Record exact revision
      env:
        EXPECTED_SHA: ${{ env.CANDIDATE_SHA }}
      run: 'mkdir -p ci-evidence

        [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]

        test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

        git show -s --format="%H %s" | tee ci-evidence/revision.txt

        node --version | tee ci-evidence/node-version.txt

        df -h | tee ci-evidence/disk-before.txt

        printf "%s\n" "$(nproc)" | tee ci-evidence/cpus.txt

        printf "%s\n" "$GITHUB_SHA" | tee ci-evidence/workflow-sha.txt

        '
    - name: Install locked dependencies
      run: "set +e\n(\n  set -e\n  corepack pnpm install --frozen-lockfile\n) 2>&1 | tee \"ci-evidence/install-locked-dependencies.log\"\
        \nresult=${PIPESTATUS[0]}\necho \"install-locked-dependencies=$result\" >> ci-evidence/exits.txt\nexit \"$result\"\
        \n"
      id: install
      env:
        QWEN_SKIP_PREPARE: '1'
    - name: Build and bundle
      run: "set +e\n(\n  set -e\n  npm run build\n  npm run bundle\n) 2>&1 | tee \"ci-evidence/build-and-bundle.log\"\nresult=${PIPESTATUS[0]}\n\
        echo \"build-and-bundle=$result\" >> ci-evidence/exits.txt\nexit \"$result\"\n"
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      id: build
    - name: Install test and lint prerequisites
      run: "set +e\n(\n  set -e\n  sudo -n apt-get update -qq\n  sudo -n apt-get install -y -qq tmux zip unzip python3-venv\n\
        \  node --input-type=module -e '\n  import {execSync} from \"node:child_process\";\n  import {appendFileSync,mkdirSync,existsSync}\
        \ from \"node:fs\";\n  import {getLinters,getLinterTempDir} from \"./scripts/lint.js\";\n  const dir=getLinterTempDir();\
        \ mkdirSync(dir,{recursive:true});\n  for (const name of [\"actionlint\",\"shellcheck\"]) {\n   execSync(getLinters()[name].installer,{stdio:\"\
        inherit\"});\n   if(!existsSync(dir+\"/\"+name+\"/\"+name)) throw new Error(name+\" missing\");\n   appendFileSync(process.env.GITHUB_PATH,dir+\"\
        /\"+name+\"\\n\");\n  }'\n  python3 -m venv \"$RUNNER_TEMP/q15595-lint-python\"\n  \"$RUNNER_TEMP/q15595-lint-python/bin/pip\"\
        \ install yamllint==1.35.1\n  echo \"$RUNNER_TEMP/q15595-lint-python/bin\" >> \"$GITHUB_PATH\"\n) 2>&1 | tee \"ci-evidence/install-test-and-lint-prerequisites.log\"\
        \nresult=${PIPESTATUS[0]}\necho \"install-test-and-lint-prerequisites=$result\" >> ci-evidence/exits.txt\nexit \"\
        $result\"\n"
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      timeout-minutes: 10
    - name: Complete CLI scope without bail
      working-directory: packages/cli
      timeout-minutes: 150
      env:
        NODE_OPTIONS: --max-old-space-size=3072
      run: 'set +e

        npx --no-install vitest run --bail=0 --retry=0 2>&1 | tee ../../ci-evidence/cli-complete.log

        result=${PIPESTATUS[0]}

        echo "cli-complete=$result" >> ../../ci-evidence/exits.txt

        exit "$result"

        '
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: ${{ always() }}
      with:
        name: q15595-r3-cli-complete-${{ github.run_id }}
        path: ci-evidence
        retention-days: 14
    name: 608c complete CLI with bail disabled
  matched_failures:
    if: github.repository == 'LyleLiu666/qwen-code'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
      QWEN_CODE_MODELS_DEV_REFRESH: 'off'
      VITEST_MIN_FORKS: '1'
      VITEST_MAX_FORKS: '3'
      VITEST_MIN_THREADS: '1'
      VITEST_MAX_THREADS: '3'
      QWEN_CI_COVERAGE: ''
      LINT_BASE_SHA: ''
      OPENAI_API_KEY: ''
      DASHSCOPE_API_KEY: ''
      QWEN_API_KEY: ''
      GEMINI_API_KEY: ''
      BASELINE_SHA: 7c6f93ca516e5501397b3ccd3c925aa362b0b702
      CANDIDATE_SHA: 608c03b0858ca0d9235805fa0d60d32eea32cead
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        ref: ${{ env.CANDIDATE_SHA }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version: 22.22.3
        package-manager-cache: false
    - name: Record exact revision
      env:
        EXPECTED_SHA: ${{ env.CANDIDATE_SHA }}
      run: 'mkdir -p ci-evidence

        [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]

        test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

        git show -s --format="%H %s" | tee ci-evidence/revision.txt

        node --version | tee ci-evidence/node-version.txt

        df -h | tee ci-evidence/disk-before.txt

        printf "%s\n" "$(nproc)" | tee ci-evidence/cpus.txt

        printf "%s\n" "$GITHUB_SHA" | tee ci-evidence/workflow-sha.txt

        '
    - name: Install matched prerequisites
      run: "set +e\n(\n  set -e\n  sudo -n apt-get update -qq\n  sudo -n apt-get install -y -qq tmux zip unzip python3-venv\n\
        \  node --input-type=module -e '\n  import {execSync} from \"node:child_process\";\n  import {appendFileSync,mkdirSync,existsSync}\
        \ from \"node:fs\";\n  import {getLinters,getLinterTempDir} from \"./scripts/lint.js\";\n  const dir=getLinterTempDir();\
        \ mkdirSync(dir,{recursive:true});\n  for (const name of [\"actionlint\",\"shellcheck\"]) {\n   execSync(getLinters()[name].installer,{stdio:\"\
        inherit\"});\n   if(!existsSync(dir+\"/\"+name+\"/\"+name)) throw new Error(name+\" missing\");\n   appendFileSync(process.env.GITHUB_PATH,dir+\"\
        /\"+name+\"\\n\");\n  }'\n  python3 -m venv \"$RUNNER_TEMP/q15595-lint-python\"\n  \"$RUNNER_TEMP/q15595-lint-python/bin/pip\"\
        \ install yamllint==1.35.1\n  echo \"$RUNNER_TEMP/q15595-lint-python/bin\" >> \"$GITHUB_PATH\"\n) 2>&1 | tee \"ci-evidence/install-matched-prerequisites.log\"\
        \nresult=${PIPESTATUS[0]}\necho \"install-matched-prerequisites=$result\" >> ci-evidence/exits.txt\nexit \"$result\"\
        \n"
      timeout-minutes: 10
    - name: Two exact revisions and both complete failure files
      run: "set -euo pipefail\nroot=\"$PWD\"\nevidence=\"$root/ci-evidence\"\noverall=0\nprintf '%s\\n' \"${ImageOS:-}\" \"\
        ${ImageVersion:-}\" > \"$evidence/runner-image.txt\"\nfor entry in \"baseline:$BASELINE_SHA\" \"candidate:$CANDIDATE_SHA\"\
        ; do\n  role=\"${entry%%:*}\"\n  sha=\"${entry#*:}\"\n  case_root=\"$RUNNER_TEMP/q15595-r3-controls-$role\"\n  case_evidence=\"\
        $evidence/$role\"\n  mkdir -p \"$case_evidence\"\n  git cat-file -e \"$sha^{commit}\"\n  git worktree add --detach\
        \ \"$case_root\" \"$sha\"\n  git -C \"$case_root\" rev-parse HEAD > \"$case_evidence/revision.txt\"\n  node --version\
        \ > \"$case_evidence/node-version.txt\"\n  nproc > \"$case_evidence/cpus.txt\"\n  df -h > \"$case_evidence/disk-before.txt\"\
        \n  set +e\n  (cd \"$case_root\" && QWEN_SKIP_PREPARE=1 corepack pnpm install --frozen-lockfile && npm run build &&\
        \ npm run bundle) 2>&1 | tee \"$case_evidence/install-build.log\"\n  build_result=${PIPESTATUS[0]}\n  set -e\n  echo\
        \ \"install-build=$build_result\" >> \"$case_evidence/exits.txt\"\n  if [ \"$build_result\" -eq 0 ]; then\n    for\
        \ item in 'memory:packages/core:src/memory/manager.test.ts' 'worker:packages/cli:src/serve/managed-runtime-session-worker.test.ts';\
        \ do\n      label=\"${item%%:*}\"\n      rest=\"${item#*:}\"\n      package=\"${rest%%:*}\"\n      file=\"${rest#*:}\"\
        \n      test -f \"$case_root/$package/$file\"\n      for attempt in 1 2 3; do\n        set +e\n        (cd \"$case_root/$package\"\
        \ && NODE_OPTIONS=--max-old-space-size=3072 npx --no-install vitest run --retry=0 --bail=0 \"$file\" --reporter=default\
        \ --reporter=json --outputFile=\"$case_evidence/$label-$attempt.json\") 2>&1 | tee \"$case_evidence/$label-$attempt.log\"\
        \n        result=${PIPESTATUS[0]}\n        set -e\n        echo \"$label-$attempt=$result\" >> \"$case_evidence/exits.txt\"\
        \n        if [ \"$result\" -ne 0 ]; then overall=1; fi\n      done\n    done\n  else\n    overall=1\n  fi\n  git worktree\
        \ remove --force \"$case_root\"\ndone\nexit \"$overall\"\n"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: ${{ always() }}
      with:
        name: q15595-r3-same-runner-${{ github.run_id }}
        path: ci-evidence
        retention-days: 14
    name: 7c and 608c same runner failure-file controls
